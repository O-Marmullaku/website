<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Sibling area · Marmullaku</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><a class="brand" href="../">Marmullaku</a><button id="sign-out" hidden>Sign out</button></header>
  <main>
    <section id="workspace" hidden>
      <div class="page-title"><div><h1 id="owner-name">Your résumé</h1><p class="muted">Shared only through your active company links.</p></div><a class="button" href="legacy.html">Family archive</a></div>
      <nav class="tabs" aria-label="Sibling area"><button id="cv-tab" aria-current="page">Edit CV</button><button id="links-tab">Company links</button></nav>
      <section id="cv-panel">
        <form id="cv-form">
          <div class="fields two"><label>Name<input name="display_name" required maxlength="100" autocomplete="name"></label><label>Professional title<input name="role" maxlength="160"></label></div>
          <label>Profile<textarea name="profile" rows="4" maxlength="4000"></textarea></label>
          <div id="cv-sections"></div>
          <label>Interests<textarea name="interests" rows="3" maxlength="2000"></textarea></label>
          <div class="save-row"><button type="submit" class="primary">Save CV</button><p id="save-status" role="status"></p></div>
        </form>
      </section>
      <section id="links-panel" hidden>
        <h2>Create a company link</h2>
        <form id="link-form">
          <div class="fields two"><label>Company<input name="company" required maxlength="120" placeholder="Company name" autocomplete="organization"></label><label>Expires in<select name="days"><option value="30">30 days</option><option value="90" selected>90 days</option><option value="180">180 days</option><option value="365">1 year</option></select></label></div>
          <label>Welcome message <span class="muted">optional</span><textarea name="message" rows="2" maxlength="300" placeholder="A short note for the hiring team"></textarea></label>
          <button type="submit" class="primary">Create private link</button>
          <p class="muted help">Anyone with the link can view your CV until it expires or you revoke it.</p>
        </form>
        <section id="created-link" class="created" hidden aria-label="New private link">
          <label>Private link<input id="link-output" readonly aria-describedby="link-once"></label>
          <div class="actions"><button id="copy-link" class="primary" type="button">Copy link</button><a id="preview-link" class="button" target="_blank" rel="noopener noreferrer">Preview welcome</a></div>
          <p id="link-once" class="muted help">Copy it now. The full link won’t be shown again.</p>
        </section>
        <p id="link-status" role="status"></p>
        <h2>Your company links</h2><div id="links-list"></div>
      </section>
    </section>
    <p id="global-status" role="alert"></p>
  </main>
  <script src="../main/backend-config.js"></script><script src="../main/access-api.js"></script><script src="session.js"></script><script src="admin.js"></script>
</body>
</html>
